<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- SOLID BLACK HARD SHADOW OF SQUIRCLE -->
  <rect x="52" y="52" width="428" height="428" rx="108" fill="#000000" />

  <!-- SQUIRCLE BASE CONTAINER (ELECTRIC VOLT LIME) -->
  <rect x="36" y="36" width="428" height="428" rx="108" fill="#D4F63D" stroke="#000000" stroke-width="20" stroke-linejoin="round" />

  <!-- INNER RETRO ACCENT DOT PATTERN (SUBTLE NEO-BRUTALIST TEXTURE) -->
  <g fill="#000000" opacity="0.12">
    <circle cx="88" cy="88" r="4.5" />
    <circle cx="120" cy="88" r="4.5" />
    <circle cx="88" cy="120" r="4.5" />
    <circle cx="120" cy="120" r="4.5" />
    <circle cx="392" cy="392" r="4.5" />
    <circle cx="424" cy="392" r="4.5" />
    <circle cx="392" cy="424" r="4.5" />
    <circle cx="424" cy="424" r="4.5" />
  </g>

  <!-- ========================================== -->
  <!-- CHUNKY MONOGRAM "M" (ICONIC & SYMMETRICAL) -->
  <!-- ========================================== -->
  <!-- Hard Black Shadow of Monogram M -->
  <path
    d="M 126 348
       V 208
       C 126 150 166 128 210 128
       C 240 128 258 144 266 164
       C 274 144 292 128 322 128
       C 366 128 406 150 406 208
       V 348
       H 354
       V 218
       C 354 188 336 174 314 174
       C 292 174 274 188 274 218
       V 348
       H 222
       V 218
       C 222 188 204 174 182 174
       C 160 174 142 188 142 218
       V 348
       Z"
    fill="#000000"
    transform="translate(12, 12)"
  />

  <!-- Main Front White Monogram M -->
  <path
    d="M 126 348
       V 208
       C 126 150 166 128 210 128
       C 240 128 258 144 266 164
       C 274 144 292 128 322 128
       C 366 128 406 150 406 208
       V 348
       H 354
       V 218
       C 354 188 336 174 314 174
       C 292 174 274 188 274 218
       V 348
       H 222
       V 218
       C 222 188 204 174 182 174
       C 160 174 142 188 142 218
       V 348
       Z"
    fill="#FFFFFF"
    stroke="#000000"
    stroke-width="18"
    stroke-linejoin="round"
  />

  <!-- ========================================== -->
  <!-- LALA AI SPARKLE STAR BADGE (TOP RIGHT)     -->
  <!-- ========================================== -->
  <g transform="translate(372, 72)">
    <!-- Black Shadow -->
    <path
      d="M 45 90 C 45 65 60 50 85 50 C 60 50 45 35 45 10 C 45 35 30 50 5 50 C 30 50 45 65 45 90 Z"
      fill="#000000"
      transform="translate(8, 8)"
    />
    <!-- Sparkle Star Body (Pop Pink) -->
    <path
      d="M 45 90 C 45 65 60 50 85 50 C 60 50 45 35 45 10 C 45 35 30 50 5 50 C 30 50 45 65 45 90 Z"
      fill="#FF85C0"
      stroke="#000000"
      stroke-width="12"
      stroke-linejoin="round"
    />
  </g>

  <!-- ========================================== -->
  <!-- SUB-BADGE PILL "MYLALA" (BOTTOM CENTER)    -->
  <!-- ========================================== -->
  <g transform="translate(176, 386)">
    <!-- Pill Hard Shadow -->
    <rect x="4" y="4" width="160" height="42" rx="14" fill="#000000" />
    <!-- Pill Body (Sunset Gold) -->
    <rect x="0" y="0" width="160" height="42" rx="14" fill="#FFD166" stroke="#000000" stroke-width="8" />
    <text
      x="80"
      y="26"
      text-anchor="middle"
      fill="#000000"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="20"
      font-weight="900"
      letter-spacing="2"
    >
      MYLALA
    </text>
  </g>
</svg>
