<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- SOLID BLACK HARD SHADOW OF CONTAINER -->
  <rect x="56" y="56" width="416" height="416" rx="98" fill="#000000" />

  <!-- SQUIRCLE BADGE (WARM CREAM CANVAS) -->
  <rect x="42" y="42" width="416" height="416" rx="98" fill="#FFFDF0" stroke="#000000" stroke-width="18" stroke-linejoin="round" />

  <!-- ========================================== -->
  <!-- CARD 1: REAR FLASHCARD (CYBER SKY BLUE)    -->
  <!-- ========================================== -->
  <g transform="rotate(-10 220 250)">
    <!-- Hard Black Shadow -->
    <rect x="94" y="94" width="240" height="270" rx="42" fill="#000000" />
    <!-- Card Body -->
    <rect x="80" y="80" width="240" height="270" rx="42" fill="#70D6FF" stroke="#000000" stroke-width="16" stroke-linejoin="round" />
  </g>

  <!-- ========================================== -->
  <!-- CARD 2: FRONT DIALOGUE CARD (VOLT LIME)    -->
  <!-- ========================================== -->
  <!-- Hard Black Shadow -->
  <path
    d="M 184 136
       H 384
       A 46 46 0 0 1 430 182
       V 338
       A 46 46 0 0 1 384 384
       H 232
       L 174 434
       L 190 384
       H 184
       A 46 46 0 0 1 138 338
       V 182
       A 46 46 0 0 1 184 136 Z"
    fill="#000000"
    transform="translate(14, 14)"
  />

  <!-- Main Front Card Body -->
  <path
    d="M 184 136
       H 384
       A 46 46 0 0 1 430 182
       V 338
       A 46 46 0 0 1 384 384
       H 232
       L 174 434
       L 190 384
       H 184
       A 46 46 0 0 1 138 338
       V 182
       A 46 46 0 0 1 184 136 Z"
    fill="#D4F63D"
    stroke="#000000"
    stroke-width="16"
    stroke-linejoin="round"
  />

  <!-- ========================================== -->
  <!-- BOLD MONOGRAM "M" (CLEAN, PROPORTIONAL)    -->
  <!-- ========================================== -->
  <!-- Shadow of M -->
  <path
    d="M 188 330
       V 200
       H 228
       L 284 274
       L 340 200
       H 380
       V 330
       H 344
       V 244
       L 298 304
       H 270
       L 224 244
       V 330
       Z"
    fill="#000000"
    transform="translate(8, 8)"
  />

  <!-- Front White Monogram M -->
  <path
    d="M 188 330
       V 200
       H 228
       L 284 274
       L 340 200
       H 380
       V 330
       H 344
       V 244
       L 298 304
       H 270
       L 224 244
       V 330
       Z"
    fill="#FFFFFF"
    stroke="#000000"
    stroke-width="15"
    stroke-linejoin="round"
  />
</svg>
