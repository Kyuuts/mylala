<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- SOLID BLACK HARD SHADOW -->
  <rect x="52" y="52" width="428" height="428" rx="112" fill="#000000" />

  <!-- MASCOT SQUIRCLE FACE (SUNBURST YELLOW) -->
  <rect x="36" y="36" width="428" height="428" rx="112" fill="#FFD166" stroke="#000000" stroke-width="20" stroke-linejoin="round" />

  <!-- ========================================== -->
  <!-- AUDIO HEADPHONE BAND (TOP ARCH)           -->
  <!-- ========================================== -->
  <path
    d="M 120 160 C 120 70 392 70 392 160"
    fill="none"
    stroke="#000000"
    stroke-width="18"
    stroke-linecap="round"
  />

  <!-- Left Headphone Ear Cushion -->
  <rect x="76" y="140" width="36" height="76" rx="18" fill="#70D6FF" stroke="#000000" stroke-width="12" />

  <!-- Right Headphone Ear Cushion + Shadow -->
  <rect x="408" y="148" width="40" height="84" rx="20" fill="#000000" />
  <rect x="400" y="140" width="40" height="84" rx="20" fill="#70D6FF" stroke="#000000" stroke-width="12" />
  <circle cx="420" cy="182" r="10" fill="#D4F63D" stroke="#000000" stroke-width="6" />

  <!-- Headphone Microphone Stem -->
  <path
    d="M 420 220 Q 420 300 348 316"
    fill="none"
    stroke="#000000"
    stroke-width="14"
    stroke-linecap="round"
  />
  <circle cx="342" cy="318" r="14" fill="#D4F63D" stroke="#000000" stroke-width="8" />

  <!-- ========================================== -->
  <!-- EYES (LEFT: AI SPARKLE, RIGHT: WINK ARC)   -->
  <!-- ========================================== -->
  <!-- Left Eye: Sparkle Star (Smart AI wink) -->
  <path
    d="M 172 230
       C 172 202 188 186 216 186
       C 188 186 172 170 172 142
       C 172 170 156 186 128 186
       C 156 186 172 202 172 230 Z"
    fill="#000000"
  />

  <!-- Right Eye: Joyful Curving Wink -->
  <path
    d="M 284 196
       Q 318 168 352 196"
    fill="none"
    stroke="#000000"
    stroke-width="18"
    stroke-linecap="round"
  />

  <!-- ========================================== -->
  <!-- ROSY CHEEKS (POP PINK)                    -->
  <!-- ========================================== -->
  <ellipse cx="140" cy="260" rx="24" ry="14" fill="#FF85C0" stroke="#000000" stroke-width="6" />
  <ellipse cx="350" cy="260" rx="24" ry="14" fill="#FF85C0" stroke="#000000" stroke-width="6" />

  <!-- ========================================== -->
  <!-- OPEN JOYFUL SMILE WITH PINK TONGUE         -->
  <!-- ========================================== -->
  <g>
    <!-- Mouth Cavity -->
    <path
      d="M 186 264
         C 186 354 304 354 304 264
         Z"
      fill="#000000"
      stroke="#000000"
      stroke-width="8"
      stroke-linejoin="round"
    />
    <!-- Pink Tongue -->
    <path
      d="M 212 304
         C 226 344 264 344 278 304
         Z"
      fill="#FF85C0"
      stroke="#000000"
      stroke-width="6"
    />
  </g>

  <!-- ========================================== -->
  <!-- TOP AI SPARKLE ACCENT (TUTOR SPARK)        -->
  <!-- ========================================== -->
  <g transform="translate(230, 26)">
    <path
      d="M 26 52 C 26 38 35 29 49 29 C 35 29 26 20 26 6 C 26 20 17 29 3 29 C 17 29 26 38 26 52 Z"
      fill="#D4F63D"
      stroke="#000000"
      stroke-width="8"
    />
  </g>
</svg>
