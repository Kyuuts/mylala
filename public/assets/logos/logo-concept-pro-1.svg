<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- BACKGROUND SQUIRCLE BADGE -->
  <!-- Hard Black Shadow -->
  <rect x="46" y="46" width="420" height="420" rx="92" fill="#000000" />
  <!-- Main Container -->
  <rect x="34" y="34" width="420" height="420" rx="92" fill="#FFFDF0" stroke="#000000" stroke-width="16" stroke-linejoin="round" />

  <!-- ========================================== -->
  <!-- BACK FLASHCARD (CYAN - 12° ROTATION)       -->
  <!-- ========================================== -->
  <g transform="rotate(-12 210 240)">
    <!-- Hard Black Shadow -->
    <rect x="78" y="86" width="230" height="270" rx="42" fill="#000000" />
    <!-- Card Body -->
    <rect x="66" y="74" width="230" height="270" rx="42" fill="#70D6FF" stroke="#000000" stroke-width="15" stroke-linejoin="round" />
    <!-- Clean Minimalist Line Details (Active Recall lines) -->
    <rect x="100" y="128" width="100" height="12" rx="6" fill="#000000" />
    <rect x="100" y="156" width="60" height="12" rx="6" fill="#000000" />
  </g>

  <!-- ========================================== -->
  <!-- FRONT FLASHCARD + DIALOGUE TAIL (LIME)    -->
  <!-- ========================================== -->
  <!-- Hard Black Shadow -->
  <path
    d="M 174 130
       H 382
       A 48 48 0 0 1 430 178
       V 338
       A 48 48 0 0 1 382 386
       H 236
       L 174 438
       L 190 386
       H 174
       A 48 48 0 0 1 126 338
       V 178
       A 48 48 0 0 1 174 130 Z"
    fill="#000000"
    transform="translate(14, 14)"
  />

  <!-- Main Front Card Body -->
  <path
    d="M 174 130
       H 382
       A 48 48 0 0 1 430 178
       V 338
       A 48 48 0 0 1 382 386
       H 236
       L 174 438
       L 190 386
       H 174
       A 48 48 0 0 1 126 338
       V 178
       A 48 48 0 0 1 174 130 Z"
    fill="#D4F63D"
    stroke="#000000"
    stroke-width="16"
    stroke-linejoin="round"
  />

  <!-- ========================================== -->
  <!-- HUMAN-CRAFTED MONOGRAM "m" (PURE & CLEAN)  -->
  <!-- ========================================== -->
  <!-- Shadow of M -->
  <path
    d="M 186 326
       V 230
       C 186 198 208 184 234 184
       C 256 184 270 196 278 214
       C 286 196 300 184 322 184
       C 348 184 370 198 370 230
       V 326
       H 336
       V 234
       C 336 216 326 208 312 208
       C 298 208 288 216 288 234
       V 326
       H 254
       V 234
       C 254 216 244 208 230 208
       C 216 208 206 216 206 234
       V 326
       Z"
    fill="#000000"
    transform="translate(8, 8)"
  />

  <!-- White Monogram M -->
  <path
    d="M 186 326
       V 230
       C 186 198 208 184 234 184
       C 256 184 270 196 278 214
       C 286 196 300 184 322 184
       C 348 184 370 198 370 230
       V 326
       H 336
       V 234
       C 336 216 326 208 312 208
       C 298 208 288 216 288 234
       V 326
       H 254
       V 234
       C 254 216 244 208 230 208
       C 216 208 206 216 206 234
       V 326
       Z"
    fill="#FFFFFF"
    stroke="#000000"
    stroke-width="15"
    stroke-linejoin="round"
  />

  <!-- Top Accent Pill (Clean Identity Tab) -->
  <rect x="330" y="152" width="60" height="14" rx="7" fill="#000000" />
