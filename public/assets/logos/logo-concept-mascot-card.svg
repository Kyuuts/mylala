<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- CONTAINER SQUIRCLE BADGE (CYBER SKY BLUE) -->
  <rect x="56" y="56" width="416" height="416" rx="98" fill="#000000" />
  <rect x="42" y="42" width="416" height="416" rx="98" fill="#70D6FF" stroke="#000000" stroke-width="18" stroke-linejoin="round" />

  <!-- ========================================== -->
  <!-- FLASHY LALA: THE LIVING FLASHCARD CHARACTER-->
  <!-- ========================================== -->

  <!-- 1. Hard Black Shadow of Card Character -->
  <rect x="150" y="118" width="224" height="284" rx="46" fill="#000000" />

  <!-- 2. Main Card Body (Pure Crisp White) -->
  <rect x="138" y="106" width="224" height="284" rx="46" fill="#FFFFFF" stroke="#000000" stroke-width="16" stroke-linejoin="round" />

  <!-- 3. Top Header Strip on Flashcard (Electric Lime) -->
  <path
    d="M 138 152
       A 46 46 0 0 1 184 106
       H 316
       A 46 46 0 0 1 362 152
       V 152
       H 138
       Z"
    fill="#D4F63D"
    stroke="#000000"
    stroke-width="16"
    stroke-linejoin="round"
  />

  <!-- 4. Cute Antenna / Audio Headphone on Card -->
  <rect x="358" y="180" width="30" height="54" rx="15" fill="#FF85C0" stroke="#000000" stroke-width="10" />
  <path
    d="M 374 230 Q 374 290 326 296"
    fill="none"
    stroke="#000000"
    stroke-width="10"
    stroke-linecap="round"
  />
  <circle cx="320" cy="296" r="9" fill="#FFD166" stroke="#000000" stroke-width="6" />

  <!-- 5. Eyes (Large Friendly Anime/Cartoon Eyes) -->
  <!-- Left Eye -->
  <ellipse cx="206" cy="216" rx="18" ry="24" fill="#000000" />
  <circle cx="212" cy="206" r="7.5" fill="#FFFFFF" />
  <circle cx="202" cy="222" r="3" fill="#FFFFFF" />

  <!-- Right Eye (Playful Wink or Round Eye) -->
  <ellipse cx="294" cy="216" rx="18" ry="24" fill="#000000" />
  <circle cx="300" cy="206" r="7.5" fill="#FFFFFF" />
  <circle cx="290" cy="222" r="3" fill="#FFFFFF" />

  <!-- 6. Rosy Pink Blush Cheeks -->
  <ellipse cx="174" cy="248" rx="16" ry="10" fill="#FF85C0" stroke="#000000" stroke-width="5" />
  <ellipse cx="326" cy="248" rx="16" ry="10" fill="#FF85C0" stroke="#000000" stroke-width="5" />

  <!-- 7. Cheerful Open Mouth with Tongue -->
  <g>
    <path
      d="M 224 252
         C 224 296 276 296 276 252
         Z"
      fill="#000000"
      stroke="#000000"
      stroke-width="6"
      stroke-linejoin="round"
    />
    <path
      d="M 238 274
         C 246 292 254 292 262 274
         Z"
      fill="#FF85C0"
      stroke="#000000"
      stroke-width="4"
    />
  </g>

  <!-- 8. Waving Friendly Hand (Right Side) -->
  <g transform="translate(358, 260) rotate(-15)">
    <!-- Shadow -->
    <circle cx="28" cy="28" r="22" fill="#000000" />
    <!-- White Glove Hand -->
    <circle cx="24" cy="24" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="12" />
    <circle cx="16" cy="14" r="8" fill="#FFFFFF" stroke="#000000" stroke-width="8" />
  </g>

  <!-- 9. Mini Feet at Bottom -->
  <ellipse cx="204" cy="392" rx="22" ry="14" fill="#D4F63D" stroke="#000000" stroke-width="10" />
  <ellipse cx="296" cy="392" rx="22" ry="14" fill="#D4F63D" stroke="#000000" stroke-width="10" />
</svg>
