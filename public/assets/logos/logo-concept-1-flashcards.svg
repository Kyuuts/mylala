<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- BACKGROUND SQUIRCLE FRAME (OPTIONAL CONTAINER) -->
  <rect x="50" y="50" width="412" height="412" rx="96" fill="#000000" />
  <rect x="36" y="36" width="412" height="412" rx="96" fill="#FFFDF0" stroke="#000000" stroke-width="16" />

  <!-- ========================================== -->
  <!-- BACK FLASHCARD (CYBER SKY BLUE - TILTED)    -->
  <!-- ========================================== -->
  <g transform="rotate(-8 230 250)">
    <!-- Hard Black Drop Shadow -->
    <rect x="76" y="80" width="280" height="300" rx="52" fill="#000000" />
    <!-- Main Card Body -->
    <rect x="62" y="66" width="280" height="300" rx="52" fill="#70D6FF" stroke="#000000" stroke-width="16" stroke-linejoin="round" />
    <!-- Decorative Lines on Back Card -->
    <line x1="102" y1="126" x2="220" y2="126" stroke="#000000" stroke-width="12" stroke-linecap="round" />
    <line x1="102" y1="160" x2="180" y2="160" stroke="#000000" stroke-width="12" stroke-linecap="round" />
    <!-- Mini Sparkle on Back Card -->
    <path d="M 285 110 C 285 96 294 88 308 88 C 294 88 285 80 285 66 C 285 80 276 88 262 88 C 276 88 285 96 285 110 Z" fill="#FFD166" stroke="#000000" stroke-width="7" />
  </g>

  <!-- ========================================== -->
  <!-- FRONT FLASHCARD + SPEECH BUBBLE (LIME)     -->
  <!-- ========================================== -->
  <g>
    <!-- Hard Black Drop Shadow of Front Card + Tail -->
    <path
      d="M 180 116
         H 400
         A 54 54 0 0 1 454 170
         V 354
         A 54 54 0 0 1 400 408
         H 230
         L 165 466
         L 190 408
         H 180
         A 54 54 0 0 1 126 354
         V 170
         A 54 54 0 0 1 180 116 Z"
      fill="#000000"
      transform="translate(14, 14)"
    />

    <!-- Main Front Card Body (Electric Lime) -->
    <path
      d="M 180 116
         H 400
         A 54 54 0 0 1 454 170
         V 354
         A 54 54 0 0 1 400 408
         H 230
         L 165 466
         L 190 408
         H 180
         A 54 54 0 0 1 126 354
         V 170
         A 54 54 0 0 1 180 116 Z"
      fill="#D4F63D"
      stroke="#000000"
      stroke-width="16"
      stroke-linejoin="round"
    />

    <!-- Internal Accent Pill Badge (Top Left of Front Card) -->
    <rect x="156" y="146" width="68" height="28" rx="10" fill="#FF85C0" stroke="#000000" stroke-width="7" />
    <circle cx="174" cy="160" r="5" fill="#000000" />
    <circle cx="190" cy="160" r="5" fill="#000000" />
    <circle cx="206" cy="160" r="5" fill="#000000" />

    <!-- ========================================== -->
    <!-- CHUNKY MONOGRAM "m" (PURE WHITE + BOLD)    -->
    <!-- ========================================== -->
    <!-- Shadow of "m" -->
    <path
      d="M 184 340 V 238 C 184 200 208 184 238 184 C 262 184 278 198 286 216 C 294 198 310 184 334 184 C 364 184 388 200 388 238 V 340 H 350 V 242 C 350 220 338 212 322 212 C 306 212 294 220 294 242 V 340 H 256 V 242 C 256 220 244 212 228 212 C 212 212 200 220 200 242 V 340 Z"
      fill="#000000"
      transform="translate(8, 8)"
    />

    <!-- Front "m" Body -->
    <path
      d="M 184 340 V 238 C 184 200 208 184 238 184 C 262 184 278 198 286 216 C 294 198 310 184 334 184 C 364 184 388 200 388 238 V 340 H 350 V 242 C 350 220 338 212 322 212 C 306 212 294 220 294 242 V 340 H 256 V 242 C 256 220 244 212 228 212 C 212 212 200 220 200 242 V 340 Z"
      fill="#FFFFFF"
      stroke="#000000"
      stroke-width="15"
      stroke-linejoin="round"
    />
  </g>

  <!-- ========================================== -->
  <!-- POP PINK AI SPARKLE STAR (TOP RIGHT)       -->
  <!-- ========================================== -->
  <g transform="translate(400, 95)">
    <!-- Hard Black Shadow -->
    <path
      d="M 40 80 C 40 58 54 44 76 44 C 54 44 40 30 40 8 C 40 30 26 44 4 44 C 26 44 40 58 40 80 Z"
      fill="#000000"
      transform="translate(6, 6)"
    />
    <!-- Sparkle Star Body -->
    <path
      d="M 40 80 C 40 58 54 44 76 44 C 54 44 40 30 40 8 C 40 30 26 44 4 44 C 26 44 40 58 40 80 Z"
      fill="#FF85C0"
      stroke="#000000"
      stroke-width="10"
      stroke-linejoin="round"
    />
  </g>
</svg>
