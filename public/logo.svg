<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background: Deep Tech Indigo to Royal Slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730A3" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Glass & Light Aura -->
    <radialGradient id="auraGrad" cx="30%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#312E81" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0" />
    </radialGradient>

    <!-- Card 1 Gradient (Electric Indigo to Vivid Cyan) -->
    <linearGradient id="cardGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Card 2 Gradient (Vivid Royal to Indigo) -->
    <linearGradient id="cardGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Center Fold / Accent Gradient (Pure White to Ice Blue) -->
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>

    <!-- Modern Soft Glow Shadow -->
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" />
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#auraGrad)" />

  <!-- Subtle Minimalist Rim Border -->
  <rect x="34" y="34" width="444" height="444" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3" />

  <!-- The Monogram: "M" formed by Layered Flashcards & Vocal Peak -->
  <g filter="url(#markShadow)">
    <!-- Back / Underneath Card (Card Depth) -->
    <path
      d="M172 168 C172 152 185 140 200 140 L312 140 C327 140 340 152 340 168 L340 200 L172 200 Z"
      fill="#FFFFFF"
      fill-opacity="0.12"
    />

    <!-- Left Pillar (Ascending Rounded Card) -->
    <rect
      x="132"
      y="180"
      width="64"
      height="180"
      rx="24"
      fill="url(#cardGradLeft)"
    />

    <!-- Right Pillar (Ascending Rounded Card) -->
    <rect
      x="316"
      y="180"
      width="64"
      height="180"
      rx="24"
      fill="url(#cardGradRight)"
    />

    <!-- Dynamic Central Geometric Chevron (Connecting into M & Speech Pulse) -->
    <path
      d="M188 188 C188 180 196 174 204 177 L256 226 L308 177 C316 174 324 180 324 188 L324 220 C324 226 320 232 314 236 L264 278 C259 282 253 282 248 278 L198 236 C192 232 188 226 188 220 Z"
      fill="url(#centerGrad)"
    />

    <!-- Floating Focus Pearl (Represents Target 600 / Focus Core) -->
    <circle cx="256" cy="144" r="14" fill="#38BDF8" />
  </g>
</svg>
